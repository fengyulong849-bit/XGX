<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小确闲 · 内容审核</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1a2b;--surface:#142336;--surface2:#1a2b44;--ink:#ede8dd;--muted:#9aa8bc;--subtle:#6b7a91;--rule:rgba(237,232,221,.1);--amber:#e8a33d;--rose:#d97a6c;--calm:#6fb3a8;--blue:#6b9fd4;--serif:'EB Garamond',serif;--sans:'Inter','Noto Sans SC',sans-serif;--mono:'DM Mono',monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh}body:before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(700px 350px at 5% 0,rgba(232,163,61,.1),transparent 70%),radial-gradient(650px 330px at 96% 10%,rgba(107,159,212,.09),transparent 68%)}button{font:inherit}button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}.topbar{height:60px;position:sticky;top:0;z-index:4;display:flex;align-items:center;padding:0 28px;background:rgba(14,26,43,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--rule);gap:16px}.brand{font:600 22px var(--serif)}.brand i{color:var(--amber)}.seal{font:500 11px var(--mono);letter-spacing:.08em;color:var(--amber);border:1px solid rgba(232,163,61,.5);padding:5px 8px;border-radius:4px}.topbar .spacer{flex:1}.back{background:transparent;color:var(--muted);border:1px solid var(--rule);border-radius:6px;padding:8px 12px;cursor:pointer}.back:hover{color:var(--ink);border-color:var(--amber)}.shell{width:min(1120px,calc(100% - 40px));margin:0 auto;padding:42px 0 72px}.headline{display:flex;align-items:end;justify-content:space-between;margin-bottom:26px;gap:20px}.eyebrow{color:var(--amber);font:500 11px var(--mono);letter-spacing:.14em}.headline h1{font:600 36px var(--serif);margin:7px 0 0}.headline p{color:var(--muted);font-size:13px;margin:0;line-height:1.65;max-width:430px;text-align:right}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.metric{background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:16px 18px}.metric .label{color:var(--subtle);font-size:11px}.metric .value{font:600 27px var(--mono);color:var(--amber);margin-top:6px}.metric .hint{color:var(--muted);font-size:11px;margin-top:4px}.queue{display:grid;gap:12px}.item{background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:20px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px}.item.hidden{border-color:rgba(217,122,108,.5)}.item-content{min-width:0}.item-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tag{font:500 10px var(--mono);letter-spacing:.05em;padding:4px 7px;border-radius:4px;background:rgba(107,159,212,.14);color:var(--blue);border:1px solid rgba(107,159,212,.22)}.tag.hidden{color:var(--rose);background:rgba(217,122,108,.14);border-color:rgba(217,122,108,.25)}.tag.count{color:var(--amber);background:rgba(232,163,61,.12);border-color:rgba(232,163,61,.25)}.content{font:500 19px var(--serif);line-height:1.65;margin:13px 0;word-break:break-word}.meta{display:flex;flex-wrap:wrap;gap:12px;color:var(--subtle);font:11px var(--mono)}.reasons{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}.reason{color:var(--muted);background:var(--bg);border:1px solid var(--rule);font-size:11px;padding:4px 8px;border-radius:4px}.actions{width:190px;border-left:1px solid var(--rule);padding-left:20px;display:flex;flex-direction:column;gap:8px;justify-content:center}.action{border:1px solid var(--rule);background:transparent;color:var(--muted);padding:9px 11px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600}.action:hover{color:var(--ink);border-color:var(--ink)}.action.approve:hover{color:var(--calm);border-color:var(--calm)}.action.hide:hover{color:var(--amber);border-color:var(--amber)}.action.reject:hover{color:var(--rose);border-color:var(--rose)}.empty,.notice{background:var(--surface);border:1px dashed var(--rule);border-radius:7px;padding:64px 24px;text-align:center;color:var(--muted)}.empty b,.notice b{display:block;color:var(--ink);font:600 24px var(--serif);margin-bottom:8px}.notice.denied{border-color:rgba(217,122,108,.45)}.notice.denied b{color:var(--rose)}.hidden{display:none!important}.modal{position:fixed;z-index:10;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.62);backdrop-filter:blur(8px)}.modal.show{display:flex}.dialog{width:min(460px,100%);background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.4)}.dialog h2{font:600 25px var(--serif);margin:0 0 8px}.dialog p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 15px}.dialog textarea{display:block;width:100%;resize:vertical;min-height:100px;background:var(--bg);border:1px solid var(--rule);border-radius:5px;color:var(--ink);font:inherit;padding:10px;outline:none}.dialog textarea:focus{border-color:var(--amber)}.error{min-height:18px;margin-top:8px;color:#f0a398;font-size:12px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.dialog-actions button{border-radius:5px;padding:9px 13px;cursor:pointer}.cancel{background:transparent;border:1px solid var(--rule);color:var(--muted)}.confirm{background:var(--amber);border:1px solid var(--amber);color:#0e1a2b;font-weight:700}.confirm:disabled{opacity:.55;cursor:wait}.toast{position:fixed;z-index:20;bottom:22px;left:50%;transform:translateX(-50%) translateY(18px);opacity:0;transition:.2s;background:#1c3049;border:1px solid var(--rule);box-shadow:0 10px 30px rgba(0,0,0,.28);padding:10px 14px;border-radius:6px;color:var(--ink);font-size:13px}.toast.show{opacity:1;transform:translateX(-50%)}@media(max-width:720px){.topbar{padding:0 16px}.shell{width:min(100% - 28px,1120px);padding-top:28px}.headline{align-items:start;flex-direction:column}.headline p{text-align:left}.summary{grid-template-columns:1fr}.item{grid-template-columns:1fr}.actions{width:auto;border-left:0;border-top:1px solid var(--rule);padding:14px 0 0;display:grid;grid-template-columns:repeat(3,1fr)}.content{font-size:18px}}
.history{margin-top:36px;padding-top:28px;border-top:1px solid var(--rule)}.history-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px}.history h2{font:600 25px var(--serif);margin:6px 0 0}.history-status{font:11px var(--mono);color:var(--subtle)}.history-list{display:grid;gap:7px}.history-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 13px;background:rgba(20,35,54,.6);border:1px solid var(--rule);border-radius:5px}.history-content{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font:14px var(--serif)}.history-item time{color:var(--subtle);font:11px var(--mono);white-space:nowrap}.history-empty{padding:22px;background:rgba(20,35,54,.6);border:1px dashed var(--rule);border-radius:5px;color:var(--subtle);font-size:12px;text-align:center}@media(max-width:720px){.history-item{grid-template-columns:auto minmax(0,1fr)}.history-item time{grid-column:2}.history-head{align-items:start;flex-direction:column;gap:5px}}
</style></head><body>
<header class="topbar"><div class="brand">小确<i>闲</i></div><span class="seal">CONTENT REVIEW</span><span class="spacer"></span><button class="back" type="button" onclick="location.href='P1_首页.html'">返回首页</button></header>
<main class="shell"><section class="headline"><div><div class="eyebrow">RESTRICTED WORKSPACE</div><h1>举报审核队列</h1></div><p>仅显示处理所需的匿名内容和举报汇总。此处不展示发布者、举报者或账号信息。</p></section><section id="workspace" class="hidden"><div class="summary"><div class="metric"><div class="label">待处理内容</div><div class="value" id="metric-total">--</div><div class="hint">当前可审核队列</div></div><div class="metric"><div class="label">自动隐藏</div><div class="value" id="metric-hidden">--</div><div class="hint">可人工恢复或继续隐藏</div></div><div class="metric"><div class="label">刷新时间</div><div class="value" id="metric-time">--</div><div class="hint">仅本页本次读取</div></div></div><div id="queue" class="queue"></div><section class="history"><div class="history-head"><div><div class="eyebrow">RECENT DECISIONS</div><h2>最近处理</h2></div><span id="history-status" class="history-status">读取中</span></div><div id="history-list" class="history-list"></div></section></section><section id="state" class="notice"><b>正在验证审核权限</b><span>请稍候…</span></section></main>
<div id="review-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="review-title"><div class="dialog"><h2 id="review-title">确认审核决定</h2><p id="review-copy"></p><label for="review-note" class="hidden">审核备注</label><textarea id="review-note" maxlength="500" placeholder="可选备注，仅用于受控审核审计，不对普通用户公开"></textarea><div class="error" id="review-error" role="alert"></div><div class="dialog-actions"><button type="button" class="cancel" onclick="closeReview()">取消</button><button type="button" class="confirm" id="review-confirm">确认处理</button></div></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="scripts/xqx-config.js"></script><script src="scripts/xqx-auth.js"></script><script>
const reasonName={privacy:'隐私风险',abuse:'不当内容',other:'其他原因'},decisionName={approved:'恢复公开',hidden:'保持隐藏',rejected:'审核拒绝'};let queue=[],history=[],pending=null;
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmt=v=>new Date(v).toLocaleString('zh-CN',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
function state(title,detail,denied=false){document.getElementById('workspace').classList.add('hidden');const el=document.getElementById('state');el.classList.remove('hidden');el.classList.toggle('denied',denied);el.innerHTML=`<b>${esc(title)}</b><span>${esc(detail)}</span>`}
function renderHistory(unavailable=false){const root=document.getElementById('history-list'),status=document.getElementById('history-status');status.textContent=unavailable?'历史暂不可用':history.length?`最近 ${history.length} 条`:'暂无记录';if(unavailable){root.innerHTML='<div class="history-empty">审核队列仍可正常使用；部署审核历史服务后，此处会显示最近处理结果。</div>';return}if(!history.length){root.innerHTML='<div class="history-empty">尚未产生审核决定。</div>';return}root.innerHTML=history.map(item=>`<article class="history-item"><span class="tag ${item.decision==='rejected'?'hidden':''}">${esc(decisionName[item.decision]||item.decision)}</span><div class="history-content">${esc(item.content)}</div><time>${fmt(item.created_at)}</time></article>`).join('')}
function render(){const root=document.getElementById('queue');document.getElementById('metric-total').textContent=queue.length;document.getElementById('metric-hidden').textContent=queue.filter(x=>x.review_status==='hidden').length;document.getElementById('metric-time').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});if(!queue.length)root.innerHTML='<div class="empty"><b>队列已清空</b><span>暂时没有需要人工处理的举报内容。</span></div>';else{root.innerHTML=queue.map(item=>`<article class="item ${item.review_status==='hidden'?'hidden-state':''}"><div class="item-content"><div class="item-top"><span class="tag ${item.review_status==='hidden'?'hidden':''}">${item.review_status==='hidden'?'已自动隐藏':'公开中'}</span><span class="tag count">${Number(item.report_count)} 次举报</span></div><div class="content">${esc(item.content)}</div><div class="meta"><span>发布 ${fmt(item.created_at)}</span><span>到期 ${fmt(item.expires_at)}</span></div><div class="reasons">${(item.reasons||[]).map(r=>`<span class="reason">${esc(reasonName[r]||r)}</span>`).join('')}</div></div><div class="actions"><button class="action approve" type="button" data-id="${item.rant_id}" data-decision="approved">恢复公开</button><button class="action hide" type="button" data-id="${item.rant_id}" data-decision="hidden">保持隐藏</button><button class="action reject" type="button" data-id="${item.rant_id}" data-decision="rejected">审核拒绝</button></div></article>`).join('');root.querySelectorAll('[data-decision]').forEach(btn=>btn.addEventListener('click',()=>openReview(btn.dataset.id,btn.dataset.decision)))}renderHistory()}
async function load(){if(!window.XQXAuth?.configured()){state('未配置云端连接','请先在 scripts/xqx-config.js 配置 Supabase 的公开连接信息。');return}try{await XQXAuth.profile();const data=await XQXAuth.moderationQueue(30);queue=Array.isArray(data.items)?data.items:[];document.getElementById('state').classList.add('hidden');document.getElementById('workspace').classList.remove('hidden');try{const historyData=await XQXAuth.moderationHistory(20);history=Array.isArray(historyData.items)?historyData.items:[];render()}catch(historyError){render();renderHistory(true)}}catch(error){if(error.message==='invalid_session'){location.replace('P1_首页.html');return}state(error.message==='forbidden'?'无审核权限':'无法读取审核队列',XQXAuth.message(error.message),error.message==='forbidden')}}
function openReview(id,decision){pending={id,decision};const words={approved:'恢复公开',hidden:'保持隐藏',rejected:'审核拒绝'};document.getElementById('review-title').textContent=words[decision];document.getElementById('review-copy').textContent=`将对这条匿名内容执行“${words[decision]}”。操作会记录在受控审核审计中。`;document.getElementById('review-note').value='';document.getElementById('review-error').textContent='';document.getElementById('review-modal').classList.add('show');document.getElementById('review-note').focus()}
function closeReview(){if(document.getElementById('review-confirm').disabled)return;pending=null;document.getElementById('review-modal').classList.remove('show')}
document.getElementById('review-confirm').addEventListener('click',async()=>{if(!pending)return;const button=document.getElementById('review-confirm'),error=document.getElementById('review-error');button.disabled=true;error.textContent='';try{await XQXAuth.reviewRant(pending.id,pending.decision,document.getElementById('review-note').value,crypto.randomUUID());closeReview();toast('审核决定已保存');await load()}catch(err){error.textContent=XQXAuth.message(err.message)}finally{button.disabled=false}});load();
</script></body></html>
