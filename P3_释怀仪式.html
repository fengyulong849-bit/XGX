<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小确闲 · 释怀仪式</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&amp;family=Noto+Serif+SC:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=DMMono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1A2B;--bg-2:#0A1320;--surface:#142336;--surface-2:#1A2B44;
  --ink:#EDE8DD;--muted:#9AA8BC;--tertiary:#6B7A91;
  --rule:rgba(237,232,221,.08);--rule-2:rgba(237,232,221,.14);
  --amber:#E8A33D;--amber-2:#F5B14C;--rose:#D97A6C;--blue:#6B9FD4;--calm:#6FB3A8;
  --grad:linear-gradient(120deg,#E8A33D,#D97A6C);
  --serif:'EB Garamond','Noto Serif SC',serif;
  --sans:'Inter','Noto Sans SC',sans-serif;
  --mono:'DMMono',monospace;
  --ease:cubic-bezier(.4,.2,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}

/* ===== 顶栏 ===== */
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(14,26,43,.85);backdrop-filter:blur(18px);border-bottom:1px solid var(--rule);display:flex;align-items:center;padding:0 24px;z-index:40;gap:14px}
.topbar .back{background:none;border:1px solid var(--rule-2);color:var(--muted);border-radius:10px;padding:7px 14px;cursor:pointer;font:inherit;font-size:13px;transition:all .2s}
.topbar .back:hover{color:var(--amber);border-color:var(--amber)}
.topbar .crumb{font-family:var(--serif);font-size:18px;font-weight:600}
.topbar .crumb i{font-style:italic;color:var(--amber)}
.topbar .spacer{flex:1}
.topbar .pts{font-family:var(--mono);font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--rule);padding:7px 14px;border-radius:999px}
.topbar .pts b{color:var(--amber)}

/* ===== 步骤条 ===== */
.steps{position:fixed;top:56px;left:0;right:0;height:72px;background:var(--bg);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:center;gap:0;z-index:30}
.step{display:flex;align-items:center;gap:10px;position:relative}
.step .dot{width:32px;height:32px;border-radius:50%;background:var(--surface);border:2px solid var(--rule-2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--tertiary);transition:all .3s var(--ease);flex-shrink:0}
.step.done .dot{background:var(--calm);border-color:var(--calm);color:var(--bg);font-weight:700}
.step.active .dot{background:var(--amber);border-color:var(--amber);color:var(--bg);font-weight:700;box-shadow:0 0 20px rgba(232,163,61,.5);animation:dotPulse 2s ease-in-out infinite}
@keyframes dotPulse{0%,100%{box-shadow:0 0 20px rgba(232,163,61,.5)}50%{box-shadow:0 0 32px rgba(232,163,61,.8)}}
.step .label{font-family:var(--serif);font-size:14px;color:var(--tertiary);transition:color .3s}
.step.done .label{color:var(--calm)}
.step.active .label{color:var(--amber);font-weight:600}
.step .check{display:none;font-size:16px}
.step.done .check{display:block}
.step.done .num{display:none}
.line{width:60px;height:2px;background:var(--rule-2);margin:0 6px;transition:background .3s}
.line.done{background:var(--calm)}

/* ===== 主内容区 ===== */
.stage{position:fixed;top:128px;left:0;right:0;bottom:0;background:var(--bg-2);overflow:hidden}
.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.panel.hidden{display:none}

/* === Step 1 写下 === */
.write-card{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--rule);border-radius:20px;padding:36px 32px;box-shadow:0 24px 64px rgba(0,0,0,.4)}
.write-card .title{font-family:var(--serif);font-size:28px;font-weight:600;margin-bottom:6px}
.write-card .title i{font-style:italic;color:var(--amber)}
.write-card .subtitle{font-size:13px;color:var(--muted);margin-bottom:24px}
.write-area{position:relative}
.write-area textarea{width:100%;min-height:180px;background:var(--bg);border:1px solid var(--rule-2);border-radius:14px;padding:16px;font:inherit;font-size:16px;color:var(--ink);resize:none;outline:none;line-height:1.75;transition:border-color .2s}
.write-area textarea:focus{border-color:var(--amber)}
.write-area textarea::placeholder{color:var(--tertiary)}
.write-area .counter{position:absolute;bottom:12px;right:16px;font-family:var(--mono);font-size:12px;color:var(--tertiary)}
.write-area .counter.near{color:var(--amber)}
.write-area .counter.max{color:var(--rose)}
.write-actions{display:flex;justify-content:flex-end;margin-top:20px;gap:10px}
.btn-ghost{background:transparent;border:1px solid var(--rule-2);color:var(--muted);font:inherit;font-size:14px;padding:10px 22px;border-radius:999px;cursor:pointer;transition:all .2s}
.btn-ghost:hover{color:var(--ink);border-color:var(--rule)}
.btn-primary{background:var(--grad);border:none;color:var(--bg);font:inherit;font-weight:700;font-size:14px;padding:10px 28px;border-radius:999px;cursor:pointer;box-shadow:0 6px 18px rgba(232,163,61,.25);transition:all .2s}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(232,163,61,.35)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

/* === Step 2 选方式 === */
.choose-wrap{width:100%;max-width:720px;text-align:center}
.choose-wrap .preview{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:20px 24px;margin-bottom:28px;text-align:left}
.choose-wrap .preview .lbl{font-size:12px;color:var(--tertiary);margin-bottom:8px;font-family:var(--mono)}
.choose-wrap .preview .text{font-family:var(--serif);font-size:20px;line-height:1.6;color:var(--ink)}
.choose-wrap .preview .text .em{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.choose-wrap .title{font-family:var(--serif);font-size:24px;font-weight:600;margin-bottom:4px}
.choose-wrap .subtitle{font-size:13px;color:var(--muted);margin-bottom:24px}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.method{background:var(--surface);border:2px solid var(--rule);border-radius:18px;padding:28px 20px;cursor:pointer;transition:all .25s var(--ease);position:relative;overflow:hidden}
.method:hover{border-color:var(--rule-2);transform:translateY(-3px)}
.method.sel{border-color:var(--amber);background:var(--surface-2);box-shadow:0 0 24px rgba(232,163,61,.2)}
.method .icon{font-size:40px;margin-bottom:12px;display:block}
.method .mname{font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:6px}
.method .mdesc{font-size:12px;color:var(--muted);line-height:1.6}
.method .mtag{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:10px;color:var(--tertiary)}
.choose-actions{display:flex;justify-content:space-between;margin-top:28px;gap:10px}

/* === Step 3 销毁舞台 === */
.destroy-stage{width:100%;height:100%;position:relative;background:radial-gradient(ellipse 60% 50% at 50% 40%,rgba(232,163,61,.08),transparent 60%)}
.stage-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.letter-card{width:340px;height:440px;background:linear-gradient(165deg,#F5E6C8,#EDD9B5);border-radius:6px;padding:32px 28px;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:0 24px 64px rgba(0,0,0,.5),0 0 40px rgba(232,163,61,.15);position:relative;overflow:hidden}
.letter-card::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 38px,rgba(107,122,145,.15) 38px,rgba(107,122,145,.15) 39px);pointer-events:none}
.letter-text{font-family:var(--serif);font-size:22px;line-height:1.8;color:#2C3E50;text-align:center;position:relative;z-index:1}
.letter-text .ch{display:inline-block;white-space:pre}
.destroy-method-tag{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);font-family:var(--serif);font-style:italic;font-size:14px;color:var(--tertiary)}
.destroy-skip{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(20,35,54,.75);backdrop-filter:blur(10px);border:1px solid var(--rule-2);color:var(--muted);font:inherit;font-size:13px;padding:9px 22px;border-radius:999px;cursor:pointer;transition:all .2s;z-index:10}
.destroy-skip:hover{color:var(--amber);border-color:var(--amber)}
.destroy-skip.hidden{display:none}

/* 风吹散 */
.wind .ch{opacity:0;animation:windBlow 2.2s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes windBlow{
  0%{opacity:1;transform:translate(0,0) rotate(0) scale(1);filter:blur(0)}
  30%{opacity:1;transform:translate(var(--tx,0),var(--ty,0)) rotate(var(--rot,0)) scale(.9);filter:blur(0)}
  100%{opacity:0;transform:translate(var(--fwx,120px),var(--fwy,-200px)) rotate(var(--frot,180deg)) scale(.3);filter:blur(4px)}
}

/* 揉成团 */
.crumpled{animation:crumpled 2s cubic-bezier(.5,.1,.5,1) forwards}
@keyframes crumpled{
  0%{border-radius:6px;transform:scale(1) rotate(0) translate(0,0)}
  20%{border-radius:8px;transform:scale(.85) rotate(-8deg) translate(0,0)}
  40%{border-radius:12px;transform:scale(.65) rotate(6deg) translate(0,0)}
  60%{border-radius:20px;transform:scale(.45) rotate(-10deg) translate(0,10px)}
  80%{border-radius:35%;transform:scale(.25) rotate(15deg) translate(40px,-20px)}
  100%{border-radius:50%;transform:scale(.08) rotate(-30deg) translate(200px,-300px);opacity:0}
}

/* 碎纸机 */
.shredder-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:340px;height:440px;overflow:hidden}
.shred-strip{position:absolute;left:0;width:100%;overflow:hidden;animation:stripFall 1.6s cubic-bezier(.4,.2,.6,1) forwards}
.shred-strip-inner{background:linear-gradient(165deg,#F5E6C8,#EDD9B5);width:100%;height:100%;display:flex;align-items:center;justify-content:center}
@keyframes stripFall{
  0%{opacity:1;transform:translateY(0) rotate(0)}
  70%{opacity:1;transform:translateY(var(--sy,300px)) rotate(var(--srot,45deg))}
  100%{opacity:0;transform:translateY(var(--sy2,600px)) rotate(var(--srot2,90deg))}
}
.shredder-mouth{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);width:380px;height:40px;background:linear-gradient(180deg,var(--surface-2),#0A1320);border:1px solid var(--rule-2);border-radius:0 0 12px 12px;display:flex;align-items:center;justify-content:center;gap:4px}
.shredder-mouth .blade{width:360px;height:3px;background:linear-gradient(90deg,var(--tertiary),var(--muted),var(--tertiary));border-radius:2px}

/* === Step 4 释怀 === */
.release-center{text-align:center}
.release-center .release-title{font-family:var(--serif);font-size:36px;font-weight:600;margin-bottom:8px}
.release-center .release-title .em{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-style:italic}
.release-center .release-sub{font-size:13px;color:var(--muted);margin-bottom:32px}
.release-points{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:28px}
.release-points .plus{font-family:var(--mono);font-size:42px;font-weight:700;color:var(--amber);animation:pointBounce .6s ease forwards}
@keyframes pointBounce{
  0%{transform:scale(.3);opacity:0}
  50%{transform:scale(1.2);opacity:1}
  100%{transform:scale(1);opacity:1}
}
.release-actions{display:flex;gap:12px;justify-content:center}
.btn-secondary{background:transparent;border:1px solid var(--rule-2);color:var(--ink);font:inherit;font-weight:500;font-size:14px;padding:11px 24px;border-radius:999px;cursor:pointer;transition:all .2s}
.btn-secondary:hover{border-color:var(--amber);color:var(--amber)}

/* === 打字机光标 === */
.type-cursor{display:inline-block;width:2px;height:1em;background:var(--amber);animation:blink 1s step-end infinite;vertical-align:text-bottom;margin-left:2px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* === 响应式 === */
.topbar nav a:hover{color:var(--amber)!important;background:var(--surface)}
@media(max-width:640px){
  .topbar{padding:0 12px}
  .topbar .crumb{font-size:16px}
  .steps{gap:0}
  .step .label{display:none}
  .line{width:30px}
  .methods{grid-template-columns:1fr}
  .letter-card{width:260px;height:340px;padding:24px 20px}
  .letter-text{font-size:16px}
  .shredder-wrap{width:260px;height:340px}
  .shredder-mouth{width:300px}
  .shredder-mouth .blade{width:280px}
  .write-card{padding:24px 20px}
  .release-center .release-title{font-size:28px}
}

@media (prefers-reduced-motion:reduce){
  .step.active .dot{animation:none}
  .wind .ch{animation:none;opacity:1}
  .crumpled{animation:none;transform:scale(.1);opacity:0}
  .shred-strip{animation:none;opacity:0}
  .type-cursor{animation:none;opacity:1}
  .release-points .plus{animation:none}
}

<script>
/* ============ 状态 ============ */
const state = {
  text: '',
  method: null,
  rewarded: false,
  rantId: '',
  releaseResult: null
};
const requestedRantId = new URLSearchParams(window.location.search).get('rant_id') || '';

function showError(message){
  const el=document.getElementById('rant-picker');
  if(el){el.textContent=message;el.style.color='var(--rose)';}
}
async function loadMyRants(){
  const picker=document.getElementById('rant-picker');
  if(!window.XQXAuth?.configured()){showError('请先登录后进行释怀。');return}
  try{
    const result=await XQXAuth.myRants();
    const items=(result.rants||[]).filter(r=>r.status==='published');
    if(!items.length){picker.textContent='你还没有可释怀的匿名发声。先去首页发布一条，再回来选择它。';picker.style.color='var(--muted)';return}
    const select=document.createElement('select');
    select.id='rant-select';select.style.cssText='width:100%;padding:10px;border-radius:10px;background:var(--surface-3);border:1px solid var(--rule-2);color:var(--ink);font:inherit';
    select.innerHTML='<option value="">选择一条匿名发声</option>'+items.map(r=>`<option value="${r.id}">${String(r.content).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}</option>`).join('');
    picker.replaceChildren(select);
    const choose=(rantId)=>{state.rantId=rantId;const item=items.find(r=>r.id===rantId);state.text=item?.content||'';btnToStep2.disabled=!state.text;};
    select.addEventListener('change',()=>choose(select.value));
    if(requestedRantId && items.some(r=>r.id===requestedRantId)){select.value=requestedRantId;choose(requestedRantId);}
    else if(requestedRantId){showError('这条匿名发声已结束或不可释怀，请重新选择。');}
  }catch(error){showError(XQXAuth.message(error.message))}
}

/* ============ 步骤切换 ============ */
function goToStep(n){
  // 更新步骤条
  document.querySelectorAll('.step').forEach(s=>{
    const sNum = parseInt(s.dataset.step);
    s.classList.toggle('active', sNum===n);
    s.classList.toggle('done', sNum<n);
  });
  // 更新连线
  document.querySelectorAll('.line').forEach(l=>{
    const lNum = parseInt(l.dataset.line);
    l.classList.toggle('done', lNum<n);
  });
  // 切换面板
  document.querySelectorAll('.panel').forEach(p=>p.classList.add('hidden'));
  document.getElementById('panel-'+n).classList.remove('hidden');
}

/* ============ Step 1 ============ */
const btnToStep2 = document.getElementById('to-step2');

btnToStep2.addEventListener('click', ()=>{
  if(!state.text) return;
  document.getElementById('preview-text').textContent = state.text;
  goToStep(2);
});

/* ============ Step 2 ============ */
let selectedMethod = null;
const methodCards = document.querySelectorAll('.method');
const btnToStep3 = document.getElementById('to-step3');

methodCards.forEach(card=>{
  card.addEventListener('click', ()=>{
    methodCards.forEach(c=>c.classList.remove('sel'));
    card.classList.add('sel');
    selectedMethod = card.dataset.method;
    btnToStep3.disabled = false;
  });
});

document.getElementById('back-step1').addEventListener('click', ()=>{
  goToStep(1);
});

btnToStep3.addEventListener('click', async ()=>{
  if(!selectedMethod) return;
  state.method = selectedMethod;
  btnToStep3.disabled=true;
  try{
    if(!state.rantId) return;
    state.releaseResult=await XQXAuth.completeRelease(state.rantId,crypto.randomUUID());
    state.rewarded=Boolean(state.releaseResult.eligible);
  }
  catch(error){showError(XQXAuth.message(error.message));btnToStep3.disabled=false;return}
  goToStep(3);
  playDestroyAnimation(selectedMethod);
});

/* ============ 跳过销毁动画（跳过仍删除，但不发积分）============ */
let skipArmed=false;
function skipDestroy(){
  const btn = document.getElementById('destroy-skip');
  if(!skipArmed){
    skipArmed = true;
    btn.textContent = '确认跳过？跳过不奖励积分，仍会删除';
    btn.style.borderColor = 'var(--rose)';
    btn.style.color = 'var(--rose)';
    setTimeout(()=>{
      skipArmed = false;
      btn.textContent = '跳过动画';
      btn.style.borderColor = '';
      btn.style.color = '';
    }, 4000);
    return;
  }
  state.rewarded = false;
  goToStep(4);
}

/* 进入 Step4 时结算文案 */
function finishDestroy(){
  goToStep(4);
}
function settleRelease(){
  const sub = document.getElementById('release-sub');
  const plus = document.getElementById('point-plus');
  if(!state.rewarded){
    sub.textContent = state.releaseResult ? '销毁完成。发布未满 24 小时，本次不加积分。' : '已跳过动画，仍完成删除，本次不加积分。';
    plus.style.visibility = 'hidden';
    return;
  }
  sub.textContent = `销毁完成 · +${state.releaseResult?.points_delta||0} 积分已到账`;
  plus.style.visibility = 'visible';
}

/* ============ Step 3 销毁动画 ============ */
function playDestroyAnimation(method){
  const textEl = document.getElementById('letter-text');
  const methodTag = document.getElementById('method-tag');
  const letterCard = document.getElementById('letter-card');

  // 设置信纸文字
  textEl.innerHTML = '';
  const chars = state.text.split('');
  chars.forEach(ch=>{
    const span = document.createElement('span');
    span.className = 'ch';
    span.textContent = ch;
    textEl.appendChild(span);
  });

  // 重置状态
  letterCard.classList.remove('crumpled');
  letterCard.style.transform = '';
  letterCard.style.borderRadius = '';

  if(method === 'wind'){
    methodTag.textContent = '🍃 风吹散中…';
    // 逐字飘散
    const spans = textEl.querySelectorAll('.ch');
    const totalTime = 2200;
    spans.forEach((sp, i)=>{
      const delay = i * 60;
      // 随机方向
      const fwx = (Math.random() > 0.5 ? 1 : -1) * (80 + Math.random()*160);
      const fwy = -(150 + Math.random()*200);
      const frot = (Math.random() > 0.5 ? 1 : -1) * (120 + Math.random()*120);
      sp.style.setProperty('--fwx', fwx+'px');
      sp.style.setProperty('--fwy', fwy+'px');
      sp.style.setProperty('--frot', frot+'deg');
      sp.style.animationDelay = delay+'ms';
    });
    setTimeout(()=>finishDestroy(), totalTime + chars.length * 60 + 200);
  }
  else if(method === 'crumpling'){
    methodTag.textContent = '🗒️ 揉成团中…';
    letterCard.classList.add('crumpled');
    setTimeout(()=>finishDestroy(), 2000 + 200);
  }
  else if(method === 'shredder'){
    methodTag.textContent = '✂️ 碎纸机启动…';
    // 创建碎纸条
    const stageCenter = document.getElementById('stage-center');
    stageCenter.innerHTML = '';

    const wrap = document.createElement('div');
    wrap.className = 'shredder-wrap';

    const stripCount = 12;
    const stripHeight = 440 / stripCount;

    // 把文字按行拆分到各条
    const textLines = state.text.split('');
    let charIdx = 0;
    const charsPerStrip = Math.max(1, Math.ceil(textLines.length / stripCount));

    for(let i=0; i<stripCount; i++){
      const strip = document.createElement('div');
      strip.className = 'shred-strip';
      strip.style.top = (i * stripHeight) + 'px';
      strip.style.height = stripHeight + 'px';

      const inner = document.createElement('div');
      inner.className = 'shred-strip-inner';

      // 把字符分配到各条
      let stripText = '';
      for(let j=0; j<charsPerStrip && charIdx<textLines.length; j++, charIdx++){
        stripText += textLines[charIdx];
      }
      inner.textContent = stripText || '·';

      strip.appendChild(inner);

      const delay = i * 70;
      const sy = 200 + Math.random()*200;
      const sy2 = 400 + Math.random()*300;
      const srot = (Math.random() > 0.5 ? 1 : -1) * (20 + Math.random()*40);
      const srot2 = (Math.random() > 0.5 ? 1 : -1) * (60 + Math.random()*60);

      strip.style.setProperty('--sy', sy+'px');
      strip.style.setProperty('--sy2', sy2+'px');
      strip.style.setProperty('--srot', srot+'deg');
      strip.style.setProperty('--srot2', srot2+'deg');
      strip.style.animationDelay = delay + 'ms';

      wrap.appendChild(strip);
    }

    // 碎纸机口
    const mouth = document.createElement('div');
    mouth.className = 'shredder-mouth';
    mouth.innerHTML = '<div class="blade"></div>';
    wrap.appendChild(mouth);

    stageCenter.appendChild(wrap);
    setTimeout(()=>finishDestroy(), 1600 + stripCount*70 + 200);
  }
}

/* ============ Step 4 打字机 ============ */
function playTypewriter(){
  const el = document.getElementById('release-em');
  const text = '归零';
  el.textContent = '';
  let idx = 0;
  const cursor = document.createElement('span');
  cursor.className = 'type-cursor';
  el.appendChild(cursor);

  const timer = setInterval(()=>{
    if(idx < text.length){
      const t = document.createTextNode(text[idx]);
      el.insertBefore(t, cursor);
      idx++;
    } else {
      clearInterval(timer);
      cursor.remove();
      // 显示 +100 积分（仅在满足奖励条件时）
      setTimeout(()=>{
        const plus = document.getElementById('point-plus');
        if(state.rewarded){
          plus.style.visibility = 'visible';
          // 重置动画
          plus.style.animation = 'none';
          plus.offsetHeight;
          plus.style.animation = '';
        }else{
          plus.style.visibility = 'hidden';
        }
      }, 200);
    }
  }, 120);
}

/* ============ 初始化 ============ */
document.getElementById('try-again').addEventListener('click', ()=>{
  // 重置所有状态
  state.text = '';
  state.method = null;
  state.rewarded = false;
  state.rantId = '';
  state.releaseResult = null;
  selectedMethod = null;
  skipArmed = false;
  btnToStep2.disabled = true;
  methodCards.forEach(c=>c.classList.remove('sel'));
  btnToStep3.disabled = true;
  // 重置释放页面
  document.getElementById('release-em').textContent = '归零';
  document.getElementById('point-plus').style.visibility = 'hidden';
  // 重置销毁舞台
  const stageCenter = document.getElementById('stage-center');
  stageCenter.innerHTML = '';
  const freshCard = document.createElement('div');
  freshCard.className = 'letter-card';
  freshCard.id = 'letter-card';
  freshCard.innerHTML = '<div class="letter-text" id="letter-text"></div><div class="destroy-method-tag" id="method-tag"></div>';
  stageCenter.appendChild(freshCard);
  // 允许下一次重播打字机
  const p4 = document.getElementById('panel-4');
  if(p4) delete p4.dataset.played;
  goToStep(1);
  loadMyRants();
});

// 在 Step4 显示时播放打字机（先结算积分文案，再打字机）
const observer = new MutationObserver(()=>{
  const panel4 = document.getElementById('panel-4');
  if(!panel4.classList.contains('hidden') && !panel4.dataset.played){
    panel4.dataset.played = 'true';
    settleRelease();
    playTypewriter();
  }
});
observer.observe(document.getElementById('panel-4'), {attributes:true, attributeFilter:['class']});

loadMyRants();

</script>
