<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小确闲 · 角色管理</title><style>
:root{--bg:#0e1a2b;--surface:#142336;--ink:#ede8dd;--muted:#9aa8bc;--rule:rgba(237,232,221,.12);--amber:#e8a33d;--rose:#d97a6c;--calm:#6fb3a8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans SC",sans-serif}main{width:min(680px,calc(100% - 32px));margin:0 auto;padding:12vh 0}.bar{display:flex;align-items:center;gap:12px;margin-bottom:28px}.brand{font-family:serif;font-size:25px;font-weight:600}.brand i{color:var(--amber)}.tag{color:var(--amber);border:1px solid rgba(232,163,61,.45);padding:5px 8px;font:11px monospace;border-radius:4px}.card{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:28px;box-shadow:0 20px 60px #0004}.eyebrow{color:var(--amber);font:11px monospace;letter-spacing:.12em}.card h1{font:32px serif;margin:8px 0}.sub{color:var(--muted);font-size:13px;line-height:1.7}.field{margin:24px 0 10px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.field input{width:100%;background:var(--bg);border:1px solid var(--rule);border-radius:5px;padding:12px;color:var(--ink);font:14px monospace;outline:none}.field input:focus{border-color:var(--amber)}.actions{display:flex;gap:8px;margin-top:16px}.actions button{flex:1;border:1px solid var(--rule);border-radius:5px;padding:11px;cursor:pointer;color:var(--ink);background:transparent}.actions .grant:hover{border-color:var(--calm);color:var(--calm)}.actions .revoke:hover{border-color:var(--rose);color:var(--rose)}.status{min-height:22px;margin-top:16px;font-size:13px;color:var(--muted)}.status.ok{color:var(--calm)}.status.err{color:#f0a398}.back{display:inline-block;margin-top:22px;color:var(--muted);font-size:13px;text-decoration:none}.back:hover{color:var(--amber)}</style></head><body><main><div class="bar"><div class="brand">小确<i>闲</i></div><span class="tag">ADMIN ACCESS</span></div><section class="card"><div class="eyebrow">RESTRICTED SETTINGS</div><h1>审核员角色管理</h1><p class="sub">仅管理员可以授予或撤销 moderator。权限判断由服务端完成，本页面不保存账号名单，也不能修改 admin 角色。</p><div class="field"><label for="target">目标用户 Auth User UID</label><input id="target" autocomplete="off" placeholder="粘贴 UUID，例如 00000000-0000-0000-0000-000000000000"></div><div class="actions"><button class="grant" id="grant" type="button">授予 moderator</button><button class="revoke" id="revoke" type="button">撤销 moderator</button></div><div id="status" class="status" role="alert">正在验证管理员权限…</div></section><a class="back" href="P1_首页.html">返回首页</a></main><script src="scripts/xqx-config.js"></script><script src="scripts/xqx-auth.js"></script><script>
const target=document.getElementById('target'),status=document.getElementById('status'),buttons=[document.getElementById('grant'),document.getElementById('revoke')];const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;function setStatus(text,type=''){status.textContent=text;status.className=`status ${type}`};async function change(action){const value=target.value.trim();if(!uuid.test(value)){setStatus('请输入有效的 Auth User UID','err');return}buttons.forEach(x=>x.disabled=true);setStatus('正在提交…');try{const result=await XQXAuth.manageModerator(value,action,crypto.randomUUID());setStatus(result.replayed?'请求已幂等处理':`${action==='grant'?'已授予':'已撤销'} moderator`,'ok');target.value=''}catch(error){if(error.message==='invalid_session'){location.replace('P1_首页.html');return}setStatus(XQXAuth.message(error.message),'err')}finally{buttons.forEach(x=>x.disabled=false)}}document.getElementById('grant').onclick=()=>change('grant');document.getElementById('revoke').onclick=()=>change('revoke');(async()=>{if(!XQXAuth.configured()){setStatus('未配置云端连接','err');return}try{await XQXAuth.manageModerator(crypto.randomUUID(),'grant',crypto.randomUUID())}catch(error){if(error.message==='forbidden')setStatus('当前账号不是 admin，无法管理角色','err');else if(error.message!=='user_unavailable')setStatus('管理员权限验证失败，请稍后重试','err')}})();
</script></body></html>
